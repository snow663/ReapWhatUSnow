[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snowforge-blueprints"
version = "0.1.0"
description = "Parametric, revision-controlled mechanical drawing generator for AI-assisted drafting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SnowForge contributors"}]
dependencies = ["ezdxf>=1.3,<2", "CairoSVG>=2.7,<3"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
test = ["pytest>=8", "pypdf>=5"]

[project.scripts]
snowforge = "snowforge.cli:main"

[tool.setuptools.packages.find]
include = ["snowforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
